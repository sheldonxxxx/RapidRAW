name: MCP evidence infrastructure

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-contract:
    name: Evidence and fixture contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix mcp
      - run: npm run build --prefix mcp
      # These portable pure tests do not run the native engine and never count as pixel coverage.
      - run: node --test mcp/test/coverage-evidence.test.mjs mcp/test/coverage-report.test.mjs mcp/test/reclassify-coverage.test.mjs mcp/test/photo-quality-manifest.test.mjs mcp/test/photo-review-policy.test.mjs mcp/test/icc-inspect.test.mjs
