name: MCP

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci --prefix mcp
      - run: npm test --prefix mcp

  native:
    runs-on: macos-14
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_MIN_STACK: '16777216'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.98.1'
          rustflags: ''
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: mcp
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features mcp --lib --locked
      - name: Test native GPU render regressions
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --features mcp --lib --locked gpu_processing::engine_regression_tests::gpu_gui_mcp_render_contract_matches_cpu_reference -- --ignored --exact --test-threads=1 --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features mcp --lib --locked gpu_processing::precision_tests::gpu_precision_preserves_ramp_and_tile_boundaries -- --ignored --exact --test-threads=1 --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features mcp --lib --locked gpu_processing::precision_tests::gpu_mask_only_flare_and_tall_blur_region_invariance -- --ignored --exact --test-threads=1 --nocapture
          cargo test --manifest-path src-tauri/Cargo.toml --features mcp --lib --locked gpu_processing::preview_perf_bench::cached_preview_resources_match_fresh_renders -- --ignored --exact --test-threads=1 --nocapture
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
